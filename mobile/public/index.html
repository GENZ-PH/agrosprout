<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Link previews (chat apps, submission forms). Text matches manifest.json. -->
    <meta name="description" content="Compare crop rotations and planting months using NASA Earth data. Saved results work offline." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgroSprout" />
    <meta property="og:title" content="AgroSprout: crop rotation planner" />
    <meta property="og:description" content="Compare crop rotations and planting months using NASA Earth data. Saved results work offline." />
    <meta property="og:url" content="https://agrosprout.inovsea.com/" />
    <meta property="og:image" content="https://agrosprout.inovsea.com/logo512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <!-- PWA: installable on phones and laptops, works offline after the first visit -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AgroSprout" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Register the service worker built by workbox (npm run build:web).
      // Skipped on localhost so `expo start` never serves stale code.
      if ("serviceWorker" in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (err) {
            console.warn("Service worker registration failed", err);
          });
        });
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
